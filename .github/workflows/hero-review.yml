name: Hero integration validation (no deployment)
on:
  push:
    branches: ['release/home-hero']
    paths: ['.github/hero/**', '.github/workflows/hero-review.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Transform exact approved source without preview dummy content
        run: |
          python .github/hero/integrate.py
          node --check assets/hero/home-hero.js
          git diff --check
      - name: Verify actual browser navigation and preserved page content
        env:
          HERO_REPORT_DIR: ${{ runner.temp }}/hero-report
        run: python .github/hero/check_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hero-browser-checks
          path: ${{ runner.temp }}/hero-report/
          retention-days: 2
  blobs:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python .github/hero/integrate.py
      - name: Store only verified output Git blobs (no ref updates)
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,hashlib,json,os,pathlib,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='illumin8-dev/richon-academy'
          assert os.environ['GITHUB_REF']=='refs/heads/release/home-hero'
          files={'index.html':'8802d344cd484b13367e8852f50ada63d54be93e','assets/hero/home-hero.css':'2076eef18f53556dee413e2004239368986e53e9','assets/hero/home-hero.js':'dfa25abfefcb9c67754ba8a0eafa859c0984e94c','assets/hero/richon-hero-desktop.webp':'e3051bec26ce4ca2160ab8a96fd7169dd382683e'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          opener=urllib.request.build_opener(NoRedirect())
          for name,digest in files.items():
              data=pathlib.Path(name).read_bytes()
              assert len(data)<1024*1024
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==digest
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request('https://api.github.com/repos/illumin8-dev/richon-academy/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with opener.open(req,timeout=30) as r:
                  assert r.status==201
                  response=json.loads(r.read(16384))
              assert response['sha']==digest
              print('VERIFIED_BLOB',name,digest)
          print('No branch ref, production homepage, server, database or cloud policy was changed by this workflow.')
