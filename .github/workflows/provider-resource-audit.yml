name: Official provider resource review (read-only)
on:
  push:
    branches: ['fix/backend-provider-design-audit']
    paths: ['.github/workflows/provider-resource-audit.yml']
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Quarantine official public documents for inspection only
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request, zipfile, subprocess, json
          from urllib.parse import urlsplit
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'provider-review'
          out.mkdir()
          base='https://developers.naver.com/inc/devcenter/downloads/'
          files=[('naver-official.zip',base+'bi/NAVER_login_KR.zip'),
                 ('naver-solo-guide.pdf',base+'naveridro/naverlogin_solo_guide.pdf')]
          class SameHost(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  u=urlsplit(newurl)
                  if u.scheme!='https' or u.netloc!='developers.naver.com':
                      raise ValueError('unexpected_resource_redirect')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SameHost())
          manifest=[]
          for name,url in files:
              with opener.open(url,timeout=30) as r:
                  assert r.status==200
                  data=r.read(24*1024*1024+1)
                  content_type=r.headers.get('Content-Type','')
              assert len(data)<=24*1024*1024
              assert data.startswith(b'PK') if name.endswith('.zip') else data.startswith(b'%PDF-')
              (out/name).write_bytes(data)
              record={'name':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                      'content_type':content_type,'signature_hex':data[:8].hex()}
              manifest.append(record);print(json.dumps(record))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          # Review artifact only; no downloaded code is executed or deployed.
          with zipfile.ZipFile(out/'review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              paths=subprocess.check_output(['git','ls-files','backend','edge','.github/portal','.github/workflows']).decode().splitlines()
              for name in paths:
                  p=pathlib.Path(name)
                  assert p.is_file() and not p.is_symlink()
                  if p.name.startswith('.env'): continue
                  z.write(p,name)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-review-public-source
          path: ${{ runner.temp }}/provider-review/
          retention-days: 1
          if-no-files-found: error
