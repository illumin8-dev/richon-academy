name: Official provider resource review (read-only)
on:
  push:
    branches: ['fix/backend-provider-design-audit']
    paths: ['.github/workflows/provider-resource-audit.yml']
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Save exact official public files and review source (no secrets)
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request, zipfile
          from urllib.parse import urlsplit
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'provider-review'
          out.mkdir()
          base='https://developers.naver.com/inc/devcenter/downloads/'
          files=[('naver-official.zip',base+'bi/NAVER_login_KR.zip','514bfabb66c4dc6d09b19c9b39d137be07846dfe855bf5a4c0c9eef8f3b0682d7'),
                 ('naver-solo-guide.pdf',base+'naveridro/naverlogin_solo_guide.pdf','84f43a01d8d91a0339f7c96e8bfc4bdda6e70053099cafaf4a9b86f3ecd281c18')]
          class SameHost(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  u=urlsplit(newurl)
                  if u.scheme!='https' or u.netloc!='developers.naver.com':
                      raise ValueError('unexpected_resource_redirect')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SameHost())
          for name,url,digest in files:
              with opener.open(url,timeout=30) as r:
                  assert r.status==200
                  data=r.read(2*1024*1024+1)
              assert len(data)<=2*1024*1024 and hashlib.sha256(data).hexdigest()==digest
              (out/name).write_bytes(data)
              print('VERIFIED',name,len(data),digest)
          # Only tracked source directories, never .git or environment files.
          with zipfile.ZipFile(out/'review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              import subprocess
              paths=subprocess.check_output(['git','ls-files','backend','edge','.github/portal','.github/workflows']).decode().splitlines()
              for name in paths:
                  p=pathlib.Path(name)
                  assert p.is_file() and not p.is_symlink() and '.env' not in p.name
                  z.write(p,name)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-review-public-source
          path: ${{ runner.temp }}/provider-review/
          retention-days: 1
          if-no-files-found: error
