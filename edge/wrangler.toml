name = "richon-account-router"
main = "worker.mjs"
compatibility_date = "2026-09-22"
workers_dev = false
preview_urls = false
# No live routes in this preparation config. After rollout approval, attach only:
# routes = [
#   { pattern = "https://richonacademy.com/auth/*", zone_name = "richonacademy.com" },
#   { pattern = "https://richonacademy.com/portal/*", zone_name = "richonacademy.com" }
# ]
[vars]
PORTAL_ENABLED = "true"
# Internal test: tag must point to richon-portal-gh-35946050229-1 before deployment.
