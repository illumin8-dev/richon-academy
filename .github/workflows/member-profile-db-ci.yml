name: Member profile DB preparation (no deployment)
on:
  pull_request:
    paths:
      - 'ops/prepare_member_profiles.sql'
      - 'backend/tests/member_profile_prepare_check.py'
      - '.github/workflows/member-profile-db-ci.yml'
permissions:
  contents: read
jobs:
  disposable-postgres:
    strategy:
      matrix:
        postgres: ['17-bookworm', '18-bookworm']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neondb_owner -d neondb"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install declared dependencies (no cloud authentication)
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate exact owner SQL and failure rollback
        env:
          RICHON_EMPTY_TEST_DB: 'YES'
          RICHON_TEST_DATABASE_URL: postgresql://neondb_owner:ci_only_disposable_password@127.0.0.1:5432/neondb
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          unset DATABASE_URL
          python backend/tests/member_profile_prepare_check.py
