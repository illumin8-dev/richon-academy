name: Signup recovery source (read-only, temporary)
on:
  push:
    branches: ['feat/signup-consent-policy']
    paths: ['.github/workflows/signup-recovery-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Archive only committed source (no credentials, no cloud)
        run: |
          git archive --format=zip HEAD backend edge .github terms.html privacy.html > "$RUNNER_TEMP/signup-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signup-recovery-source
          path: |
            ${{ runner.temp }}/signup-source.zip
            ${{ runner.temp }}/source-sha.txt
          retention-days: 1
          if-no-files-found: error
