name: Edge rollout boundary checks (read-only)
on:
  push:
    branches: ['feat/backend-social-login']
    paths: ['edge/worker.mjs', '.github/workflows/edge-rollout-check.yml']
permissions:
  contents: read
concurrency:
  group: richon-edge-rollout-check
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Current Worker tests and form policy compatibility
        run: |
          node --test edge/*.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {handle} from './edge/worker.mjs';
          const env = {PORTAL_ENABLED:'true',PORTAL_UPSTREAM:'https://richon-portal-synthetic.as.run.app',RICHON_EDGE_SECRET:'s'.repeat(43)};
          for (const path of ['/auth/login','/auth/signup']) {
            const request = new Request('https://richonacademy.com'+path);
            const response = await handle(request, env, async()=>new Response('<form method="post"></form>', {headers:{'Content-Type':'text/html; charset=utf-8','Referrer-Policy':'no-referrer'}}));
            assert.equal(response.headers.get('Referrer-Policy'),'same-origin');
            assert.equal(response.headers.get('Cache-Control'),'no-store');
          }
          for (const origin of [null,'null','https://foreign.example.invalid']) {
            const headers = origin === null ? {} : {Origin:origin};
            const response = await handle(new Request('https://richonacademy.com/auth/start',{method:'POST',body:'provider=kakao',headers}),env,async(url,init)=>{
              assert.equal(init.headers.get('Origin'),origin);
              return new Response('{"detail":"csrf_failed"}',{status:403,headers:{'Content-Type':'application/json'}});
            });
            assert.equal(response.status,403);
            assert.equal(response.headers.get('Referrer-Policy'),'no-referrer');
          }
          console.log('PASS: existing origin HTML receives corrected form policy; caller Origin is not manufactured.');
          JS
      - name: Read-only live boundaries (no secrets or login)
        shell: python
        run: |
          import json, urllib.request, urllib.error, socket, ssl, os
          from urllib.parse import urlsplit
          SITE='https://richonacademy.com'
          ORIGIN='https://richon-portal-amjmgyepbq-as.a.run.app'
          ACCESS='raspy-bush-b23c.cloudflareaccess.com'
          PATHS=('/auth/login','/portal/mypage','/auth/kakao/callback','/auth/naver/callback')
          ALLOWED={SITE+p for p in PATHS}|{SITE+'/',SITE+'/apply.html',ORIGIN+'/auth/login'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          def get(url,wrong=False):
              assert url in ALLOWED
              # Public diagnostic identity, not authentication or a browser.
              # Same fixed GET paths and BIC-only exception approved in PR22.
              headers={'Cache-Control':'no-cache','Accept':'text/html','User-Agent':'RichonPortalDeployCheck/1.0'}
              if wrong:
                  assert url==ORIGIN+'/auth/login'
                  headers['X-Richon-Edge-Key']='deliberately-invalid-test-key'
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              try: response=opener.open(urllib.request.Request(url,headers=headers),timeout=30)
              except urllib.error.HTTPError as error: response=error
              with response: return response.code,response.headers,response.read(8193)
          def category(exc):
              reason=exc.reason if isinstance(exc,urllib.error.URLError) else exc
              if isinstance(reason,ssl.SSLCertVerificationError): return 'certificate_verification_failed'
              if isinstance(reason,ssl.SSLError): return 'tls_failed'
              if isinstance(reason,socket.gaierror): return 'dns_failed'
              if isinstance(reason,TimeoutError): return 'timeout'
              if isinstance(reason,ConnectionError): return 'connection_failed'
              return 'transport_or_parse_failed'
          failed=[]
          for path in PATHS:
              try:
                  status,headers,_=get(SITE+path)
                  location=urlsplit(headers.get('Location',''))
                  host_ok=location.scheme=='https' and location.netloc==ACCESS
                  path_ok=location.path=='/cdn-cgi/access/login/richonacademy.com'
                  ok=status in (302,303) and host_ok and path_ok
                  print(('PASS' if ok else 'FAIL')+': Access challenge / '+path+' / '+json.dumps({'status':status,'access_host':host_ok,'access_path':path_ok,'has_location':bool(headers.get('Location')),'html':'text/html' in headers.get('Content-Type',''),'cf_challenge':headers.get('cf-mitigated')=='challenge'}))
                  if not ok: failed.append('access_signin_not_confirmed')
              except Exception as exc:
                  print('FAIL: Access read / '+path+' / '+category(exc));failed.append(category(exc))
          for path in ('/','/apply.html'):
              try:
                  status,headers,_=get(SITE+path)
                  ok=status==200 and 'text/html' in headers.get('Content-Type','')
                  print(('PASS' if ok else 'FAIL')+': public HTML / '+path+' / status='+str(status))
                  if not ok: failed.append('existing_public_page_not_confirmed')
              except Exception as exc:
                  print('FAIL: public read / '+path+' / '+category(exc));failed.append(category(exc))
          for wrong in (False,True):
              try:
                  status,headers,body=get(ORIGIN+'/auth/login',wrong)
                  ok=status==403 and 'application/json' in headers.get('Content-Type','') and len(body)<=8192
                  ok=ok and json.loads(body)=={'detail':'edge_required'}
                  print(('PASS' if ok else 'FAIL')+': direct origin / '+('wrong-key' if wrong else 'no-key')+' / status='+str(status))
                  if not ok: failed.append('origin_denial_not_confirmed')
              except Exception as exc:
                  print('FAIL: origin read / '+category(exc));failed.append(category(exc))
          if failed:
              print('STOP: boundary check incomplete / '+','.join(sorted(set(failed)))+'. No raw response bodies, cookies or redirect URLs exported.')
              raise SystemExit(1)
          report='EDGE BOUNDARIES PASSED. No backend deployment, database access or provider sign-in. This does not prove real Kakao login or the email allow-list contents.'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(report+'\n')
