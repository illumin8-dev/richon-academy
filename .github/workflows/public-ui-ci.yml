name: Public UI checks (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'apply.html'
      - 'frontend/shared/**'
      - 'assets/hero/**'
      - 'assets/images/**'
      - 'assets/apply/**'
      - 'tools/check_public_ui.py'
      - '.github/workflows/public-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python3 tools/check_public_ui.py
