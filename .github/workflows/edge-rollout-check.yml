name: Edge rollout boundary checks (read-only)
on:
  push:
    branches: ['feat/backend-social-login']
    paths: ['edge/worker.mjs', '.github/workflows/edge-rollout-check.yml']
permissions:
  contents: read
concurrency:
  group: richon-edge-rollout-check
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Current Worker tests and form policy compatibility
        run: |
          node --test edge/worker.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {handle} from './edge/worker.mjs';
          const env = {PORTAL_ENABLED:'true',PORTAL_UPSTREAM:'https://richon-portal-synthetic.as.run.app',RICHON_EDGE_SECRET:'s'.repeat(43)};
          for (const path of ['/auth/login','/auth/signup']) {
            const request = new Request('https://richonacademy.com'+path);
            const response = await handle(request, env, async()=>new Response('<form method="post"></form>', {headers:{'Content-Type':'text/html; charset=utf-8','Referrer-Policy':'no-referrer'}}));
            assert.equal(response.headers.get('Referrer-Policy'),'same-origin');
            assert.equal(response.headers.get('Cache-Control'),'no-store');
          }
          for (const origin of [null,'null','https://foreign.example.invalid']) {
            const headers = origin === null ? {} : {Origin:origin};
            const response = await handle(new Request('https://richonacademy.com/auth/start',{method:'POST',body:'provider=kakao',headers}),env,async(url,init)=>{
              assert.equal(init.headers.get('Origin'),origin);
              return new Response('{"detail":"csrf_failed"}',{status:403,headers:{'Content-Type':'application/json'}});
            });
            assert.equal(response.status,403);
            assert.equal(response.headers.get('Referrer-Policy'),'no-referrer');
          }
          console.log('PASS: existing origin HTML receives corrected form policy; caller Origin is not manufactured.');
          JS
      - name: Read-only live boundaries (no secrets or login)
        shell: python
        run: |
          import json, urllib.request, urllib.error
          from urllib.parse import urlsplit
          import os
          SITE='https://richonacademy.com'
          ORIGIN='https://richon-portal-amjmgyepbq-as.a.run.app'
          PATHS=('/auth/login','/portal/mypage','/auth/kakao/callback','/auth/naver/callback')
          ALLOWED={SITE+p for p in PATHS}|{SITE+'/',SITE+'/apply.html',ORIGIN+'/auth/login'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          def get(url,wrong=False):
              assert url in ALLOWED
              headers={'Cache-Control':'no-cache'}
              if wrong:
                  assert url==ORIGIN+'/auth/login'
                  headers['X-Richon-Edge-Key']='deliberately-invalid-test-key'
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              try: response=opener.open(urllib.request.Request(url,headers=headers),timeout=30)
              except urllib.error.HTTPError as error: response=error
              with response: return response.code,response.headers,response.read(8193)
          def need(ok,code):
              if not ok: raise RuntimeError(code)
          try:
              for path in PATHS:
                  status,headers,_=get(SITE+path)
                  location=urlsplit(headers.get('Location',''))
                  need(status in (302,303) and location.scheme=='https' and location.netloc=='raspy-bush-b23c.cloudflareaccess.com' and location.path=='/cdn-cgi/access/login/richonacademy.com','access_signin_not_confirmed')
                  print('PASS: Access challenge / '+path)
              for path in ('/','/apply.html'):
                  status,headers,_=get(SITE+path)
                  need(status==200 and 'text/html' in headers.get('Content-Type',''),'existing_public_page_not_confirmed')
                  print('PASS: existing public HTML / '+path)
              for wrong in (False,True):
                  status,headers,body=get(ORIGIN+'/auth/login',wrong)
                  need(status==403 and 'application/json' in headers.get('Content-Type','') and len(body)<=8192,'origin_denial_not_confirmed')
                  need(json.loads(body)=={'detail':'edge_required'},'origin_denial_not_confirmed')
                  print('PASS: direct origin denied / '+('wrong-key' if wrong else 'no-key'))
          except Exception:
              print('STOP: boundary check did not pass. No response body, cookie or redirect query exported.')
              raise SystemExit(1) from None
          report='EDGE BOUNDARIES PASSED. No backend deployment, database access or provider sign-in. This does not prove real Kakao login or the email allow-list contents.'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(report+'\n')
