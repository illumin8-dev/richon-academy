name: Store verified official Naver asset (no deployment)
on:
  push:
    branches: ['fix/backend-provider-design-audit']
    paths: ['.github/workflows/provider-resource-audit.yml']
permissions:
  contents: read
jobs:
  asset:
    if: github.repository == 'illumin8-dev/richon-academy' && github.ref == 'refs/heads/fix/backend-provider-design-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Store exact reviewed PNG bytes only; never update a ref or execute downloaded content
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, io, json, os, urllib.request, zipfile
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          opener=urllib.request.build_opener(NoRedirect())
          try:
              assert os.environ['GITHUB_REPOSITORY']=='illumin8-dev/richon-academy'
              assert os.environ['GITHUB_REF']=='refs/heads/fix/backend-provider-design-audit'
              url='https://developers.naver.com/inc/devcenter/downloads/bi/NAVER_login_KR.zip'
              with opener.open(url,timeout=30) as response:
                  assert response.status==200
                  archive=response.read(1048577)
              assert len(archive)<=1048576
              assert hashlib.sha256(archive).hexdigest()=='e589e3c1daf62cfcb6c38906856b953ae955c97d1411b3c3ce85d29e61c4471c'
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  name='NAVER_login_KR/NAVER_login_Light_KR_green_center_H48.png'
                  assert z.getinfo(name).file_size==6334
                  png=z.read(name)
              assert hashlib.sha256(png).hexdigest()=='4d086f9c7f12e8b99589669042415db9de4fd31a28f5eac8721ebf893caaf06d'
              expected='358bdabfcb4dfa157f349cbf4b111105db859815'
              assert hashlib.sha1(b'blob '+str(len(png)).encode()+b'\0'+png).hexdigest()==expected
              payload=json.dumps({'content':base64.b64encode(png).decode('ascii'),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/illumin8-dev/richon-academy/git/blobs',
                  data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with opener.open(request,timeout=30) as response:
                  assert response.status==201
                  result=json.loads(response.read(16384))
              assert result['sha']==expected
              print('VERIFIED_OFFICIAL_NAVER_BLOB='+expected)
              print('No branch ref, deployment, database, cloud credentials, or user data changed by this job.')
          except Exception:
              print('STOP: official asset could not be verified/stored. No raw response or credentials printed.')
              raise SystemExit(1) from None
