name: Enrollment UI checks (synthetic only)
on:
  push:
    branches: ['feat/backend-*', 'fix/backend-*']
    paths: ['backend/enrollment_static/**', 'backend/tests/enrollment_browser.py', '.github/workflows/enrollment-ui-ci.yml']
  pull_request:
    paths: ['backend/enrollment_static/**', 'backend/tests/enrollment_browser.py', '.github/workflows/enrollment-ui-ci.yml']
permissions:
  contents: read
concurrency:
  group: enrollment-ui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install isolated test browser
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Check enrollment UI with synthetic responses
        run: |
          node --check backend/enrollment_static/enrollments.js
          python backend/tests/enrollment_browser.py
