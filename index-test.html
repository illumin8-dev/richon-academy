    /* 같은 밝은 원본을 어둡게 만든 OFF 배경 */
    .hero-bg-dark {
      z-index: 0;
      filter: brightness(.27) saturate(.52) contrast(1.04);
    }

    /* 같은 구도의 밝은 원본을 화면 전체에 겹쳐 노출을 올리듯 보여준다. */
    .hero-bg-light {
      z-index: 1;
      opacity: 1;
    }

    .js .hero-bg-light {
      opacity: 0;
    }

    /* OFF 시 따뜻한 검정 계열. 녹색 tint 사용 안 함 */
    .hero-dim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(10, 9, 8, .66) 0%,
          rgba(13, 12, 11, .55) 34%,
          rgba(16, 14, 13, .31) 58%,
          rgba(18, 16, 14, .20) 100%);
      opacity: .88;
      will-change: opacity;
    }

    /* 스위치 주변에 경계가 보이지 않는 넓은 온기만 먼저 생긴다. */
    .switch-glow {
      position: absolute;
      z-index: 3;
      left: var(--switch-x);
      top: var(--switch-y);
      width: clamp(360px, 38vw, 720px);
      aspect-ratio: 1.28;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.72);
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center,
        rgba(255, 225, 176, .24) 0%,
        rgba(255, 231, 196, .12) 28%,
        rgba(244, 121, 32, .045) 48%,
        rgba(244, 121, 32, 0) 74%);
      filter: blur(46px);
      mix-blend-mode: screen;
      will-change: opacity, transform;
    }

    .copy-wrap {
      position: absolute;
      z-index: 6;
      left: clamp(28px, 8vw, 150px);
      top: 50%;
      width: min(800px, 51vw);
      transform: translateY(-54%);
    }

    .copy {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      margin: 0;
      will-change: opacity, transform;
    }

    .copy h1 {
      margin: 0;
      font-size: clamp(38px, 4vw, 72px);
      line-height: 1.16;
      letter-spacing: -.045em;
      font-weight: 800;
      text-wrap: balance;
    }

    .copy-off {
      color: #fff;
      opacity: 0;
      transform: translateY(0);
      text-shadow: 0 2px 28px rgba(0,0,0,.22);
    }

    .js .copy-off { opacity: 1; }

    .copy-on {
      color: var(--ink);
      opacity: 1;
      transform: translateY(0);
    }

    .js .copy-on {
      opacity: 0;
      transform: translateY(22px);
    }

    .copy-on h1 {
      font-size: clamp(36px, 3.35vw, 62px);
    }

    .copy-on .line {
      display: block;
      white-space: nowrap;
    }

    .copy-on .accent {
      color: var(--richon-orange);
      white-space: nowrap;
    }

    .subcopy {
      margin: 26px 0 0;
      font-size: clamp(16px, 1.28vw, 22px);
      line-height: 1.65;
      letter-spacing: -.02em;
      color: var(--sub-ink);
      font-weight: 500;
    }

    .subcopy strong {
      color: #2b2927;
      font-weight: 750;
    }

    /* 첫 화면에서만 보이는 아주 조용한 스크롤 힌트 */
    .scroll-guide {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: clamp(26px, 4vh, 46px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,.72);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .24em;
      line-height: 1;
      text-shadow: 0 2px 18px rgba(0,0,0,.34);
      pointer-events: none;
      will-change: opacity, transform;
    }

    .scroll-guide .chevron {
      width: 9px;
      height: 9px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      animation: scrollNudge 1.7s ease-in-out infinite;
    }

    @keyframes scrollNudge {
      0%, 100% { transform: translateY(0) rotate(45deg); opacity: .55; }
      50% { transform: translateY(6px) rotate(45deg); opacity: 1; }
    }

    /* 기존 리치온 헤더를 오프닝 뒤에만 노출 */
    .site-nav {
      position: fixed;
      z-index: 60;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-bottom: 1px solid rgba(28,31,38,.08);
      box-shadow: 0 10px 30px -24px rgba(0,0,0,.25);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-16px);
      pointer-events: none;
      will-change: opacity, transform;
    }

    .site-logo {
      display: flex;
      align-items: baseline;
      gap: 2px;
      color: inherit;
      text-decoration: none;
      font-weight: 900;
      font-size: 23px;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    .site-logo .r { color: #1c1f26; }
    .site-logo .o { color: var(--richon-orange); }
    .site-logo small {
      margin-left: 8px;
      align-self: center;
      color: #a9842f;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .25em;
    }

    .site-menu {
      display: flex;
      gap: 26px;
      align-items: center;
      font-size: 14.5px;
      font-weight: 500;
    }

    .site-menu a {
      color: #686b72;
      text-decoration: none;
      transition: color .2s ease;
    }

    .site-menu a:hover { color: #1c1f26; }

    .site-nav-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .site-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 11px 20px;
      white-space: nowrap;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: .22s;
    }

    .site-btn-line {
      color: #1c1f26;
      border: 1px solid #d8d4c8;
    }

    .site-btn-line:hover {
      border-color: #c9a86a;
      color: #a9842f;
    }

    .site-btn-o {
      color: #fff;
      background: var(--richon-orange);
    }

    .site-btn-o:hover {
      background: #ff913f;
      transform: translateY(-2px);
      box-shadow: 0 14px 26px -12px rgba(244,121,32,.5);
    }

    .site-burger {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
      border: 0;
      background: none;
      cursor: pointer;
    }

    .site-burger span {
      width: 24px;
      height: 2px;
      border-radius: 2px;
      background: #1c1f26;
      transition: .3s;
    }

    .site-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .site-burger.open span:nth-child(2) { opacity: 0; }
    .site-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 900px) {
      .site-menu {
        display: none;
        position: fixed;
        inset: 0;
        z-index: -1;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        background: rgba(255,255,255,.98);
        font-size: 22px;
      }

      .site-menu.show { display: flex; }
      .site-nav-right .site-btn:not(.site-btn-o) { display: none; }
      .site-burger { display: flex; z-index: 61; }
      .site-logo small { display: none; }
    }

    /* 끝부분이 본문의 흰 화면과 자연스럽게 이어지는지 확인 */
    .after-hero {
      min-height: 65vh;
      display: grid;
      place-items: start center;
      padding-top: 10vh;
      background: #fff;
    }

    .after-hero::before {
      content: "";
      display: block;
      width: min(1120px, 84vw);
      height: 1px;
      background: rgba(0,0,0,.06);
    }

    @media (max-width: 900px) {
      :root {
        --switch-x: 64%;
        --switch-y: 50%;
      }

      .hero-scroll {
        height: 165vh;
        min-height: 900px;
      }

      .hero-sticky {
        min-height: 560px;
      }

      .hero-layer {
        background-position: 60% center;
        transform: scale(1.02);
      }

      .hero-dim {
        background:
          linear-gradient(180deg,
            rgba(8,8,8,.56) 0%,
            rgba(10,10,10,.38) 48%,
            rgba(12,11,10,.26) 100%);
      }

      .copy-wrap {
        left: 24px;
        right: 24px;
        top: 23%;
        width: auto;
        transform: none;
      }

      .copy h1 {
        font-size: clamp(34px, 9vw, 52px);
        line-height: 1.18;
      }

      .copy-on .line {
        white-space: normal;
      }

      .subcopy {
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.62;
      }
    }

    @media (max-width: 560px) {
      :root {
        --switch-x: 68%;
        --switch-y: 54%;
      }

      .hero-layer {
        background-position: 61% center;
      }

      .copy-wrap {
        top: 17%;
      }

      .copy h1 {
        font-size: clamp(31px, 9.2vw, 44px);
      }

      .subcopy strong {
        display: block;
        margin-bottom: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-scroll {
        height: 100svh;
        min-height: 620px;
      }

      .hero-bg-dark,
      .hero-dim,
      .copy-off,
      .switch-glow,
      .scroll-guide {
        display: none;
      }

      .hero-bg-light {
        opacity: 1 !important;
      }

      .copy-on {
        opacity: 1 !important;
        transform: none !important;
      }

      .site-nav {
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
        pointer-events: auto !important;
      }
    }
  </style>

    </div>
    <div class="site-nav-right">
      <a class="site-btn site-btn-line" href="https://open.kakao.com/o/gPdQcklh" target="_blank" rel="noopener">오픈카톡방</a>
      <a class="site-btn site-btn-o" href="apply.html">강의 신청</a>
      <button class="site-burger" id="siteBurger" aria-label="메뉴" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main>
    <section class="hero-scroll" id="heroScroll" aria-label="리치온 아카데미 히어로">
      <div class="hero-sticky" id="heroSticky">
        <div class="hero-layer hero-bg-dark" aria-hidden="true"></div>
        <div class="hero-layer hero-bg-light" id="heroLight" aria-hidden="true"></div>
        <div class="hero-dim" id="heroDim" aria-hidden="true"></div>
        <div class="switch-glow" id="switchGlow" aria-hidden="true"></div>

        <div class="scroll-guide" id="scrollGuide" aria-hidden="true">
          <span>SCROLL</span>
          <span class="chevron"></span>
        </div>

        <div class="copy-wrap">
          <div class="copy copy-off" id="copyOff">
            <h1>막막한 부동산 투자,<br>무엇부터 봐야할까요?</h1>
          </div>

          <div class="copy copy-on" id="copyOn">
            <h1><span class="line">리치온 아카데미에서</span><span class="line">투자의 기준을 <span class="accent">ON</span> 하세요.</span></h1>
            <p class="subcopy">
              <strong>경매 / 재개발 / 분양권 / 갭투자</strong><br>
              흐름에 따른 실전 투자의 길
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="after-hero" aria-hidden="true"></section>
  </main>

  <script>
    (() => {
      const scrollSection = document.getElementById('heroScroll');
      const heroLight = document.getElementById('heroLight');
      const heroDim = document.getElementById('heroDim');
      const switchGlow = document.getElementById('switchGlow');
      const scrollGuide = document.getElementById('scrollGuide');
      const siteNav = document.getElementById('siteNav');
      const siteBurger = document.getElementById('siteBurger');
      const siteMenu = document.getElementById('siteMenu');
      const copyOff = document.getElementById('copyOff');
      const copyOn = document.getElementById('copyOn');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let ticking = false;

      const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
      const range = (value, start, end) => clamp((value - start) / (end - start));
      const smoothstep = t => t * t * (3 - 2 * t);

      function render() {
        ticking = false;
        if (reduceMotion.matches) return;

        const rect = scrollSection.getBoundingClientRect();
        const maxScroll = Math.max(1, scrollSection.offsetHeight - window.innerHeight);
        const progress = clamp(-rect.top / maxScroll);

        // 첫 진입 안내는 초반에만 보이고 바로 사라진다.
        const guideOut = smoothstep(range(progress, 0.02, 0.16));
        scrollGuide.style.opacity = String(1 - guideOut);
        scrollGuide.style.transform = `translate(-50%, ${guideOut * 8}px)`;

        // ON 화면을 충분히 보여준 뒤 기존 헤더가 뒤늦게 등장한다.
        const navIn = smoothstep(range(progress, 0.88, 0.98));
        siteNav.style.opacity = String(navIn);
        siteNav.style.transform = `translateY(${-16 * (1 - navIn)}px)`;
        siteNav.style.visibility = navIn > 0.01 ? 'visible' : 'hidden';
        siteNav.style.pointerEvents = navIn > 0.8 ? 'auto' : 'none';

        // 0.40~0.68 : 원형 마스크 없이 전체 화면의 노출이 부드럽게 올라간다.
        const lightIn = smoothstep(range(progress, 0.40, 0.68));
        heroLight.style.opacity = String(lightIn);

        // 밝은 원본이 올라오는 동안 기존 어둠도 함께 천천히 걷힌다.
        const dimOut = smoothstep(range(progress, 0.40, 0.70));
        heroDim.style.opacity = String(0.88 * (1 - dimOut));

        // 스위치 주위에는 형태가 느껴지지 않을 만큼 넓은 온기만 먼저 생긴다.
        const glowIn = smoothstep(range(progress, 0.28, 0.43));
        const glowOut = smoothstep(range(progress, 0.52, 0.78));
        const glowOpacity = glowIn * (1 - 0.72 * glowOut);
        switchGlow.style.opacity = String(glowOpacity * 0.78);
        switchGlow.style.transform = `translate(-50%, -50%) scale(${0.72 + glowIn * 0.28})`;

        // OFF 카피는 실제 화면이 밝아지기 시작한 뒤 자연스럽게 사라진다.
        const offOut = smoothstep(range(progress, 0.46, 0.60));
        copyOff.style.opacity = String(1 - offOut);
        copyOff.style.transform = `translateY(${-8 * offOut}px)`;

        // 충분히 밝아진 뒤 ON 카피가 들어온다.
        const onIn = smoothstep(range(progress, 0.62, 0.78));
        copyOn.style.opacity = String(onIn);
        copyOn.style.transform = `translateY(${18 * (1 - onIn)}px)`;
      }

      function requestRender() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(render);
        }
      }

      siteBurger?.addEventListener('click', () => {
        const open = siteBurger.classList.toggle('open');
        siteMenu.classList.toggle('show', open);
        siteBurger.setAttribute('aria-expanded', String(open));
      });

      siteMenu?.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
        siteBurger.classList.remove('open');
        siteMenu.classList.remove('show');
        siteBurger.setAttribute('aria-expanded', 'false');
      }));

      window.addEventListener('scroll', requestRender, { passive: true });
      window.addEventListener('resize', requestRender);
      reduceMotion.addEventListener?.('change', requestRender);

      render();
    })();
  </script>
</body>
</html>
