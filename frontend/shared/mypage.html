<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><title>마이페이지 | 리치온아카데미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin referrerpolicy="no-referrer">
<link rel="stylesheet" href="/portal/assets/site.css"><link rel="stylesheet" href="/portal/assets/account.css">
<script src="/portal/assets/site.js"></script><script defer src="/portal/assets/login.js"></script><script defer src="/portal/assets/account.js"></script>
</head>
<body class="richon-page account-page" data-page="mypage">
<a href="#main" class="account-skip">본문으로 이동</a>
{{SITE_HEADER}}
<main class="account-main" id="main">
<h1>마이페이지</h1>
<section class="account-panel account-gate" id="gate" aria-live="polite"><h2 id="gate-title">로그인 확인 중</h2><p id="gate-text"></p><a href="/auth/login?return_to=%2Fportal%2Fmypage" class="site-btn site-btn-o" data-richon-login id="gate-login" hidden>로그인</a><button id="retry-gate" type="button" class="site-btn site-btn-line" hidden>다시 확인</button></section>
<div id="content" hidden>
<section class="account-panel" id="my-courses"><div class="account-section-head"><h2>내 강의</h2><button id="refresh" class="account-text-button" type="button">새로고침</button></div>
<div id="list" aria-live="polite"></div><p id="list-status" class="account-status" role="status"></p><button id="retry-list" class="site-btn site-btn-line" type="button" hidden>다시 불러오기</button>
<div id="pager" class="account-pagination" hidden><span id="page-info"></span><div><button id="prev" type="button">이전</button><button id="next" type="button">다음</button></div></div>
</section>
<section class="account-panel" id="my-profile"><div class="account-section-head"><h2>내 정보</h2></div>
<dl class="account-values">
<div id="profile-name-row" hidden><dt>이름</dt><dd id="profile-name"></dd></div>
<div id="profile-phone-row" hidden><dt>휴대전화</dt><dd id="profile-phone"></dd></div>
<div id="profile-email-row" hidden><dt>이메일</dt><dd id="profile-email"></dd></div>
<div id="profile-age-row" hidden><dt>연령대</dt><dd id="profile-age"></dd></div>
<div id="profile-gender-row" hidden><dt>성별</dt><dd id="profile-gender"></dd></div>
<div><dt>가입일</dt><dd id="joined"></dd></div>
<div><dt>연결된 로그인</dt><dd id="providers" class="account-providers"></dd></div>
</dl>
<div class="account-actions"><a id="admin-link" class="site-account-link" href="/portal/admin" hidden>관리자</a><a class="account-withdrawal" href="tel:0322368944">회원탈퇴 문의</a></div>
</section>
</div>
<p id="action-status" class="account-status" role="status"></p>
</main>
{{SITE_FOOTER}}
</body></html>
