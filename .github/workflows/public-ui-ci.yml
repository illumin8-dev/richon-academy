name: Public UI checks (no deployment)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'apply.html'
      - 'privacy.html'
      - 'terms.html'
      - 'signup-guide.html'
      - 'frontend/shared/**'
      - 'assets/**'
      - 'tools/check_public_ui.py'
      - 'tools/shared_chrome.py'
      - 'tools/render_public_chrome.py'
      - 'tools/shared_chrome.py'
      - 'tools/render_public_chrome.py'
      - 'tools/build_public_pages.sh'
      - '.github/workflows/public-ui-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'apply.html'
      - 'privacy.html'
      - 'terms.html'
      - 'signup-guide.html'
      - 'frontend/shared/**'
      - 'assets/**'
      - 'tools/check_public_ui.py'
      - 'tools/build_public_pages.sh'
      - '.github/workflows/public-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python3 tools/check_public_ui.py
      - name: Build isolated Cloudflare Pages output
        run: bash tools/build_public_pages.sh
      - name: Check application inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('apply.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, 'apply inline script missing'
          Path('/tmp/richon-apply-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/richon-apply-inline.js
